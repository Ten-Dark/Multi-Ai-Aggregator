name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:security

      - name: Build Windows installer
        run: npm run dist

      - name: Build Zen extension
        run: npm run build:extension

      - name: Lint self-distributed Zen extension
        run: npx --yes web-ext@10.8.0 lint --source-dir=zen-extension --self-hosted --warnings-as-errors

      - name: Generate extension update metadata
        run: npm run release:metadata

      - name: Sign Zen extension for self-distribution
        shell: pwsh
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WEB_EXT_API_KEY) -or [string]::IsNullOrWhiteSpace($env:WEB_EXT_API_SECRET)) {
            throw 'Mozilla signing credentials are missing. Configure repository secrets AMO_API_KEY and AMO_API_SECRET before publishing a release.'
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/build/signed-extension' | Out-Null
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          npx --yes web-ext@10.8.0 sign --source-dir=zen-extension --artifacts-dir=artifacts/build/signed-extension --channel=unlisted --approval-timeout=900000 --no-input
          if ($LASTEXITCODE -ne 0) { throw 'Mozilla AMO signing failed.' }
          $signed = Get-ChildItem 'artifacts/build/signed-extension/*.xpi' | Select-Object -First 1
          if (-not $signed) { throw 'Mozilla did not produce a signed XPI.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($signed.FullName)
          try {
            $signature = $archive.Entries | Where-Object { $_.FullName -match '^META-INF/mozilla\.(rsa|sf)$' }
            if (-not $signature) { throw 'The produced XPI does not contain a Mozilla signature.' }
          } finally {
            $archive.Dispose()
          }
          Copy-Item $signed.FullName 'release/multi-ai-aggregator-zen.xpi' -Force

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'release/multi-ai-aggregator-zen.xpi')) { throw 'Signed Zen XPI is missing.' }
          $installer = Get-ChildItem 'artifacts/build/windows/Multi-AI-Aggregator-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          Copy-Item $installer.FullName 'release/' -Force
          $releaseInstaller = Join-Path 'release' $installer.Name
          $hash = (Get-FileHash $releaseInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($releaseInstaller + '.sha256') -Value ($hash + '  ' + $installer.Name) -NoNewline -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/Multi-AI-Aggregator-Setup-*.exe
            release/Multi-AI-Aggregator-Setup-*.exe.sha256
            release/multi-ai-aggregator-zen.xpi
            release/updates.json
            release/zen-extension-version.txt
